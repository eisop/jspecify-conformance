name: CI

# Controls when the workflow will run
on: [push, pull_request] 

jobs:
  # This job will build and test the JSpecify Conformance Tests on the Checker Framework
  build-and-test:
    strategy:
      matrix:
        jdk: [ 11, 17, 21 ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jspecify-conformance
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out CF JSpecify Conformance Tests
        uses: actions/checkout@v6
        with:
          path: jspecify-conformance
      - name: Set up JDK 21 for Gradle to run on
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{matrix.jdk}}
      - name: Inject JAVA_HOME_21_64 into `gradle.properties` to always use JDK 21 for Gradle
        run: mkdir ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # The conformance test framework and test suite are only published as
      # org.jspecify.conformance:*:0.0.0-SNAPSHOT, and Central Portal snapshots are deleted after
      # 90 days. To keep this build independent of whether upstream is currently re-publishing that
      # snapshot, build it from a JSpecify checkout and install it into the local Maven repository,
      # where build.gradle's mavenLocal() repository can find it.
      - name: Check out JSpecify
        uses: actions/checkout@v6
        with:
          repository: jspecify/jspecify
          path: jspecify
      - name: Build and install the JSpecify conformance snapshot
        working-directory: jspecify
        # Disable any Sign tasks: the local Maven repository does not need signatures, and CI has
        # no GPG signatory configured. This keeps publishToMavenLocal working regardless of how
        # upstream configures signing.
        run: |
          printf 'allprojects { tasks.withType(Sign).configureEach { enabled = false } }\n' > "$RUNNER_TEMP/no-signing.gradle"
          ./gradlew --init-script "$RUNNER_TEMP/no-signing.gradle" publishToMavenLocal
      - name: Build and Test
        run: gradle build test
