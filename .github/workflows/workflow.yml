name: CI

# A pull request runs once, for pull_request: running for push as well would run it twice.
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [main]

# Cancel a pull request's run when a newer commit is pushed to it; never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default minimal permissions for all jobs.
permissions:
  contents: read

jobs:
  # This job will build and test the JSpecify Conformance Tests on the Checker Framework
  build-and-test:
    # The job name and the matrix key form the check name, e.g. "build-and-test (21)", that
    # branch protection requires.
    strategy:
      fail-fast: false
      matrix:
        jdk: [11, 17, 21]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jspecify-conformance
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out CF JSpecify Conformance Tests
        uses: actions/checkout@v7
        with:
          path: jspecify-conformance
      - name: Set up JDK 21 for Gradle to run on
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{matrix.jdk}}
      - name: Inject JAVA_HOME_21_64 into `gradle.properties` to always use JDK 21 for Gradle
        run: mkdir -p ~/.gradle && echo "org.gradle.java.home=$JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # Build conformance test artifacts locally.
      - name: Create publish-helper init script
        run: |
          cat > "$RUNNER_TEMP/publish-helper.gradle" <<'INIT'
          allprojects {
            pluginManager.apply('maven-publish')
            tasks.withType(Sign).configureEach { enabled = false }
          }
          INIT
      # conformance-tests (the assertions/samples ZIP) comes from the main JSpecify repo.
      - name: Check out JSpecify
        uses: actions/checkout@v7
        with:
          repository: jspecify/jspecify
          path: jspecify
      - name: Build and install conformance-tests
        working-directory: jspecify
        run: ./gradlew --init-script "$RUNNER_TEMP/publish-helper.gradle" :conformance-tests:publishToMavenLocal
      # conformance-test-framework (the test driver) comes from the JSpecify reference checker.
      - name: Check out JSpecify reference checker
        uses: actions/checkout@v7
        with:
          repository: eisop/jspecify-reference-checker
          ref: main-eisop
          path: jspecify-reference-checker
      # The settings.gradle isolates the sub-project and avoids building the CF.
      - name: Build and install conformance-test-framework
        working-directory: jspecify-reference-checker
        run: |
          cat > conformance-test-framework/settings.gradle <<'SETTINGS'
          rootProject.name = 'conformance-test-framework'
          dependencyResolutionManagement {
            versionCatalogs {
              libs {
                library('guava', 'com.google.guava:guava:33.6.0-jre')
                library('jspecify', 'org.jspecify:jspecify:1.0.0')
                library('truth', 'com.google.truth:truth:1.4.5')
                library('junit', 'junit:junit:4.13.2')
              }
            }
          }
          SETTINGS
          ./gradlew --project-dir conformance-test-framework \
            --init-script "$RUNNER_TEMP/publish-helper.gradle" publishToMavenLocal

      - name: Build and Test
        run: ./gradlew build -PuseJdkVersion=${{ matrix.jdk }}
