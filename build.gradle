/*
 * This is a build file for a downstream project for the EISOP Checker Framework
 * that runs the JSpecify conformance tests.
 */

plugins {
  id 'java-library'

  // Code formatting; defines targets "spotlessApply" and "spotlessCheck"
  // Requires JDK 11 or higher; the plugin crashes under JDK 8.
  id 'com.diffplug.spotless' version '8.6.0'
}

repositories {
  // The JSpecify conformance test framework and test suite are only ever published as
  // 'org.jspecify.conformance:*:0.0.0-SNAPSHOT'. Central Portal snapshots are deleted after
  // 90 days (https://central.sonatype.org/publish/publish-portal-snapshots/), so this remote
  // snapshot can disappear whenever upstream stops re-publishing it. mavenLocal() lets us fall
  // back to a copy that the build (see the CI workflow) publishes from a JSpecify checkout,
  // which keeps the build reproducible regardless of the remote snapshot's lifetime.
  mavenLocal()
  // Snapshot repository for the JSpecify conformance test framework and test suite. Scope it to
  // the 'org.jspecify.conformance' group so this repository is never consulted (or able to serve
  // stale/unexpected artifacts) for any other dependency.
  maven {
    name = 'Central Portal Snapshots'
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
    content {
      includeGroup('org.jspecify.conformance')
    }
  }
  mavenCentral()
}

java {
  sourceCompatibility = 1.9
  targetCompatibility = 1.9
}

configurations {
  jSpecifyConformanceTests
}

dependencies {
  // Use JUnit Jupiter for testing.
  testImplementation libs.junit
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation libs.jspecify.conformance.framework
  jSpecifyConformanceTests libs.jspecify.conformance.tests

  // The conformance test directly uses Guava (Splitter, ImmutableList/Set/SortedSet). Depend on it
  // explicitly rather than relying on it leaking in transitively from the conformance framework.
  testImplementation libs.guava
}

// The Checker Framework artifacts come from the version in the version catalog by default.
//
// To test against a locally-built Checker Framework, publish it to the local Maven repository
//     cd checker-framework && ./gradlew publishToMavenLocal
// and run Gradle here with "-PcfVersion=<that build's version>", e.g.
//     ./gradlew test -PcfVersion=3.49.5-eisop2-SNAPSHOT
// mavenLocal() is already first in the repositories block above, so the freshly published
// artifacts are the ones resolved. checker-qual and checker-util arrive transitively through
// the checker POM.
//
// Checked at the top level of the script: inside a dependencies{} block, hasProperty binds to
// the DependencyHandler and never reaches the project, so a check there silently reads false.
if (hasProperty('cfLocal')) {
  throw new GradleException(
  '-PcfLocal is no longer supported. It read jars out of the Checker Framework\'s build\n'
  + 'directories, which required a framework-test jar that no Checker Framework task builds.\n'
  + 'Publish that checkout with "./gradlew publishToMavenLocal" and pass\n'
  + '-PcfVersion=<its version> instead.')
}

dependencies {
  // findProperty, not hasProperty: see the comment above.
  def cfVersion = findProperty('cfVersion')
  if (cfVersion) {
    testImplementation "io.github.eisop:checker:${cfVersion}"
    testImplementation "io.github.eisop:framework-test:${cfVersion}"
    testImplementation "io.github.eisop:checker-qual:${cfVersion}"
  } else {
    testImplementation libs.checkerframework.checker
    testImplementation libs.checkerframework.framework.test
    testImplementation libs.checkerframework.qual
  }
}

spotless {
  format 'misc', {
    // define the files to apply `misc` to
    target '*.md', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces(2)
    endWithNewline()
  }
  java {
    googleJavaFormat()
    formatAnnotations()
  }
  groovyGradle {
    target '**/*.gradle'
    greclipse()  // which formatter Spotless should use to format .gradle files.
    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    // endWithNewline() // Don't want to end empty files with a newline
  }
}

// Unzip JSpecify conformance tests using the artifact
task unzipJSpecifyConformanceTestSuite(type: Copy) {
  description = 'Unzips the JSpecify conformance test suite into the build directory.'

  dependsOn(configurations.jSpecifyConformanceTests)

  from zipTree(configurations.jSpecifyConformanceTests.singleFile)
  into layout.buildDirectory.dir("jspecify-conformance-tests")
}

// Run JSpecify conformance tests
test {
  useJUnitPlatform()
  jvmArgs(
      '--add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
      '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED',
      '--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED'
      )

  // Capture at configuration time to avoid referencing project in execution-time closures.
  def buildDirPath = layout.buildDirectory.get().asFile.absolutePath
  def projectDirPath = projectDir.absolutePath

  // Conformance tests
  inputs.files(unzipJSpecifyConformanceTestSuite)
  inputs.files("${projectDirPath}/src/test/resources/jspecify-conformance-test-report.txt")

  doFirst {
    systemProperties([
      "ConformanceTest.inputs": "${buildDirPath}/jspecify-conformance-tests/assertions/org/jspecify/conformance/tests",
      "ConformanceTest.report": "${projectDirPath}/src/test/resources/jspecify-conformance-test-report.txt",
      // listFiles() returns null if the directory doesn't exist; the null-safe operators return "" in that case.
      "ConformanceTest.deps"  : new File("${buildDirPath}/jspecify-conformance-tests/deps").listFiles()?.collect { it.absolutePath }?.join(":") ?: ""
    ])
  }

  // Conformance tests on samples
  inputs.files("${projectDirPath}/src/test/resources/jspecify-conformance-test-on-samples-report.txt")

  doFirst {
    systemProperties([
      "ConformanceTest.samples.inputs": "${buildDirPath}/jspecify-conformance-tests/samples",
      "ConformanceTest.samples.report": "${projectDirPath}/src/test/resources/jspecify-conformance-test-on-samples-report.txt",
    ])
  }

  testLogging {
    showStackTraces = true
    showStandardStreams = true
    events "failed"
    exceptionFormat = "full"
  }

  // NOTE: addTestListener is NOT honored when the configuration cache is enabled
  // (see https://github.com/gradle/gradle/issues/25311). Because this project enables the
  // configuration cache in gradle.properties, the diagnostics below only run when the build is
  // invoked with --no-configuration-cache. The `testLogging` block above is the configuration-cache
  // -safe way to surface failures; this listener adds the extra "code around the failure" context
  // for local debugging runs. A future change could move this to a BuildService-based
  // OperationCompletionListener to make it configuration-cache compatible.
  addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {}
        void afterSuite(TestDescriptor suite, TestResult result) {}
        void beforeTest(TestDescriptor descriptor) {}
        void afterTest(TestDescriptor descriptor, TestResult result) {
          if (result.resultType == TestResult.ResultType.FAILURE) {
            println "Oh no! There are failed conformance tests!"
            result.failures.each { failure ->
              def rawFailure = failure.rawFailure
              def matcher = rawFailure =~ /\+FAIL: (\S+):(\d+):/
              matcher.each { match ->
                def fileName = match[1]
                def lineNumber = match[2].toInteger()
                println "Test failed in file: ${fileName}"
                println "Test failed at line number: ${lineNumber}"
                def conformanceInputs = System.getProperty('ConformanceTest.inputs')
                if (conformanceInputs == null) {
                  conformanceInputs = "${buildDirPath}/jspecify-conformance-tests/assertions/org/jspecify/conformance/tests"
                }
                def filePath = "${conformanceInputs}/${fileName}"
                println "Test failed directory: ${filePath}"
                def file = new File(filePath)
                if (file.exists()) {
                  def lines = file.readLines()
                  def start = Math.max(0, lineNumber - 3)
                  def end = Math.min(lines.size(), lineNumber + 2)
                  println "Code around the failure:"
                  for (int i = start; i < end; i++) {
                    println "${i + 1}: ${lines[i]}"
                  }
                  println ""
                } else {
                  println "File not found: ${filePath}"
                }
              }
            }
          }
        }
      }
      ) // addTestListener
} // test
